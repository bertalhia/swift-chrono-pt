name: Bug report
description: Report an incorrect or unexpected result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Please describe the bug clearly.
    validations:
      required: true

  - type: input
    id: reference-date
    attributes:
      label: Reference date
      description: What date/time were you using as the reference?
    validations:
      required: true

  - type: input
    id: timezone
    attributes:
      label: Time zone
      description: What time zone were you using?
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What result did you get?
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What result did you expect?
    validations:
      required: true