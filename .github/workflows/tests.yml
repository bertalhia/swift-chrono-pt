name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main gets its own result; a branch or a pull request
  # only needs its latest.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - run: swift build -c release

  linux:
    name: Linux, Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Images pinned by digest: a tag can be moved to other contents. To
        # update, read the digest of the tag from the registry and replace it.
        include:
          - swift: "6.0"
            image: swift:6.0@sha256:cc93f1594d63122eff78133f799f7d45a441fa4c5193e164ecea6065fd448fdd
          - swift: "6.4"
            image: swift:6.4@sha256:bb6e5d5f2a97bc07cf8022c1a3e062f8164b8fd078698327ce2ab097e02a91dc
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test

  platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, watchOS, tvOS, visionOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild build -scheme swift-chrono-pt -destination "generic/platform=${{ matrix.platform }}"

  format:
    name: Format
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --recursive --strict Sources Tests
